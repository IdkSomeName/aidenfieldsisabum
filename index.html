<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Aiden Fields Live Goon Count</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
    color: white;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

#header {
    position: absolute;
    top: 50px;
    font-size: 3vw;
    font-weight: bold;
    letter-spacing: 4px;
    text-shadow: 0 0 10px white;
}

#title {
    font-size: 2vw;
    margin-bottom: 20px;
    opacity: 0.9;
    text-align: center;
}

#counter {
    font-size: 7vw;
    font-weight: bold;
    opacity: 0.03;
    filter: blur(1px);
}

#clock {
    position: absolute;
    top: 12px;
    right: 16px;
    font-size: 18px;
    opacity: 0.7;
}

.side {
    position: absolute;
    top: 50%;
    width: 280px;
    height: 450px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

#left { left: 10px; }
#right { right: 10px; }

.spin {
    width: 140px;
    height: 140px;
    animation: spin 0.9s linear infinite;
    filter: drop-shadow(0 0 10px white);
}

#right .spin {
    animation-direction: reverse;
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.chat {
    width: 100%;
    height: 270px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.15);
    padding: 6px;
    font-size: 12px;
    opacity: 0.8;
    background: rgba(255,255,255,0.02);
}

.msg {
    margin: 4px 0;
    opacity: 0.7;
}

/* ALT IMAGE FADE */
#altFlash {
    position: absolute;
    width: 100%;
    height: 100%;
    z-index: 999;
    object-fit: cover;
    opacity: 0;
    display: none;
    pointer-events: none;
    transition: opacity 0.6s ease-in-out;
}
</style>
</head>

<body>

<audio id="bgmusic" src="song.mp3" loop></audio>
<audio id="altmusic" src="alt.mp3"></audio>

<img id="altFlash" src="alt.png"/>

<div id="clock">--:--:-- EST</div>
<div id="header">LIVE AIDEN GOON COUNTER</div>
<div id="title">show up to school aiden 😂</div>
<div id="counter">0</div>

<div class="side" id="left">
    <img class="spin" src="left.png"/>
    <div class="chat" id="chatLeft"></div>
</div>

<div class="side" id="right">
    <img class="spin" src="right.png"/>
    <div class="chat" id="chatRight"></div>
</div>

<script>
window.onload = () => {

const counter = document.getElementById("counter");
const clock = document.getElementById("clock");
const chatLeft = document.getElementById("chatLeft");
const chatRight = document.getElementById("chatRight");

const music = document.getElementById("bgmusic");
const alt = document.getElementById("altmusic");
const flash = document.getElementById("altFlash");

music.volume = 0.12;

let altActive = false;

/* unlock audio */
document.addEventListener("click", () => {
    music.play().catch(()=>{});
}, { once: true });

/* CHAT */
const messages = [
    "aiden is a chud",
    "aiden goons are critical mass",
    "aiden is a basiatakis blud",
    "live aiden incident unfolding",
    "chat is releasing te gubbehs",
    "aiden stock down 900%",
    "happy birthday daniel! you really thouht id let this day pass quietly?",
    "this is unempluzzed behaviour",
    "breaking: aidin detected",
    "bro is a strawberry"
];

function addChat(box) {
    if (!box) return;
    const msg = document.createElement("div");
    msg.className = "msg";
    msg.textContent = messages[Math.floor(Math.random() * messages.length)];
    box.appendChild(msg);
    if (box.children.length > 12) box.removeChild(box.firstChild);
}

setInterval(() => {
    addChat(chatLeft);
    addChat(chatRight);
}, 900);

/* CLOCK */
function getESTNow() {
    return new Date(new Date().toLocaleString("en-US", {
        timeZone: "America/New_York"
    }));
}

function updateClock() {
    const now = getESTNow();
    clock.textContent =
        String(now.getHours()).padStart(2,"0") + ":" +
        String(now.getMinutes()).padStart(2,"0") + ":" +
        String(now.getSeconds()).padStart(2,"0") + " EST";
}

/* ALT EVENT */
function triggerAlt() {
    if (altActive) return;
    altActive = true;

    music.pause();

    flash.style.display = "block";

    requestAnimationFrame(() => {
        flash.style.opacity = "1";
    });

    alt.currentTime = 0;
    alt.play().catch(()=>{});

    function endAlt() {
        flash.style.opacity = "0";

        setTimeout(() => {
            flash.style.display = "none";
        }, 600);

        alt.pause();
        music.play().catch(()=>{});
        altActive = false;
    }

    alt.onended = endAlt;

    setTimeout(endAlt, 6000);
}

/* 1% chance per second */
setInterval(() => {
    if (Math.random() < 0.01) triggerAlt();
}, 1000);

/* COUNTER + LOOP */
let value = 0;

function tick() {
    value += Math.floor(Math.random() * 9000) + 1000;

    counter.textContent = value.toLocaleString();

    counter.style.opacity = 0.02 + Math.random() * 0.03;
    counter.style.filter = `blur(${0.6 + Math.random() * 1.5}px)`;
    counter.style.transform =
        `translate(${Math.random()*4-2}px, ${Math.random()*4-2}px)`;

    updateClock();
    requestAnimationFrame(tick);
}

tick();

};
</script>

</body>
</html>
