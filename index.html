<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aiden Fields Live Goon Count</title>

<style>
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
        font-family: Arial, sans-serif;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
    }

    #title {
        font-size: 2vw;
        margin-bottom: 20px;
        opacity: 0.9;
        letter-spacing: 2px;
        text-align: center;
    }

    #counter {
        font-size: 7vw;
        font-weight: bold;
        color: white;
        opacity: 0.03;
        filter: blur(1px);
        user-select: none;
        text-shadow:
            0 0 2px white,
            0 0 4px white,
            0 0 8px white;
    }

    #clock {
        position: absolute;
        top: 12px;
        right: 16px;
        font-size: 18px;
        opacity: 0.7;
        letter-spacing: 1px;
    }

    #tiny {
        position: absolute;
        bottom: 8px;
        right: 12px;
        font-size: 10px;
        opacity: 0.2;
    }
</style>
</head>
<body>

<div id="clock">00:00:00 EST</div>

<div id="title">
    aiden fields live goon count
</div>

<div id="counter">0</div>

<div id="tiny">
    resets at EST midnight
</div>

<script>
const counter = document.getElementById("counter");
const clock = document.getElementById("clock");

function getESTNow() {
    return new Date(
        new Date().toLocaleString("en-US", {
            timeZone: "America/New_York"
        })
    );
}

function getESTDateString() {
    return getESTNow().toLocaleDateString("en-CA");
}

let currentDate = getESTDateString();
let value = 0;

function updateClock() {
    const now = getESTNow();

    const h = String(now.getHours()).padStart(2, "0");
    const m = String(now.getMinutes()).padStart(2, "0");
    const s = String(now.getSeconds()).padStart(2, "0");

    clock.textContent = `${h}:${m}:${s} EST`;
}

function tick() {
    const newDate = getESTDateString();

    // Reset at EST midnight
    if (newDate !== currentDate) {
        currentDate = newDate;
        value = 0;
    }

    // Increase rapidly
    value += Math.floor(Math.random() * 9000) + 1000;

    // Nearly unreadable effect
    counter.style.opacity = 0.02 + Math.random() * 0.03;
    counter.style.filter = `blur(${0.6 + Math.random() * 1.5}px)`;
    counter.style.transform =
        `translate(${Math.random()*4-2}px, ${Math.random()*4-2}px)`;

    counter.textContent = value.toLocaleString();

    updateClock();

    requestAnimationFrame(tick);
}

tick();
</script>

</body>
</html>
